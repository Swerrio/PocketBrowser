name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      # Reads the name, version and dependencies out of fabric.mod.json, attaches the jar to a
      # GitHub release and uploads the same jar to Modrinth.
      - uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          modrinth-id: RHFAeE3z
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          loaders: fabric
          game-versions: |
            26.1
            26.1.1
            26.1.2
            26.2
          version-type: release
          changelog-file: CHANGELOG.md
