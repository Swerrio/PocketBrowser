name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - run: ./gradlew build

      # Reads the name, version and dependencies out of fabric.mod.json, attaches the jar to a
      # GitHub release and, once the Modrinth lines below are filled in, uploads there too.
      - uses: Kira-NT/mc-publish@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          loaders: fabric
          game-versions: 26.1, 26.1.1, 26.1.2, 26.2
          version-type: release

          # modrinth-id: paste the project id from the Modrinth page
          # modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
