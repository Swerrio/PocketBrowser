name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  plan:
    name: Pick branches
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
      notes: ${{ steps.pick.outputs.notes }}

    steps:
      - name: Pick the branches for ${{ github.ref_name }}
        id: pick
        env:
          BRANCHES: |
            [
              {"branch": "master", "mc": "26.3", "java": "25", "games": "26.3"},
              {"branch": "26.2", "mc": "26.2", "java": "25", "games": "26.1\n26.1.1\n26.1.2\n26.2"}
            ]
        run: |
          case "$GITHUB_REF_NAME" in
            *+*)
              picked=$(jq -c --arg mc "${GITHUB_REF_NAME#*+}" '[.[] | select(.mc == $mc)]' <<< "$BRANCHES")
              notes=$(jq -r '.[0].branch // empty' <<< "$picked")
              ;;
            *)
              picked=$(jq -c . <<< "$BRANCHES")
              notes=master
              ;;
          esac
          if [ "$picked" = "[]" ]; then
            echo "No branch builds Minecraft ${GITHUB_REF_NAME#*+}" >&2
            exit 1
          fi
          echo "matrix={\"include\":$picked}" >> "$GITHUB_OUTPUT"
          echo "notes=$notes" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish ${{ matrix.branch }}
    needs: plan
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Check out ${{ matrix.branch }}
        uses: actions/checkout@v6
        with:
          ref: ${{ matrix.branch }}

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Resolve version metadata
        run: |
          echo "MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"
          echo "MC_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Check the tag against ${{ matrix.branch }}
        run: |
          case "$GITHUB_REF_NAME" in
            *+*) expected="v${MOD_VERSION}+${MC_VERSION}" ;;
            *) expected="v${MOD_VERSION}" ;;
          esac
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match $expected on ${{ matrix.branch }}" >&2
            exit 1
          fi

      - name: Build release artifacts
        run: ./gradlew build --stacktrace

      - name: Validate jar metadata
        run: |
          unzip -p "build/libs/pocketbrowser-${MOD_VERSION}+${MC_VERSION}.jar" fabric.mod.json > fmj.json
          cat fmj.json
          grep -q "\"version\": \"${MOD_VERSION}+${MC_VERSION}\"" fmj.json

      - name: Publish to Modrinth
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: RHFAeE3z
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            build/libs/!(*-@(dev|sources|javadoc)).jar
          version: ${{ env.MOD_VERSION }}+${{ env.MC_VERSION }}
          name: MC ${{ env.MC_VERSION }} // Pocket Browser ${{ env.MOD_VERSION }}
          version-type: release
          loaders: fabric
          game-versions: ${{ matrix.games }}
          changelog-file: CHANGELOG.md
          retry-attempts: 3

      - name: Keep the jar for the release
        uses: actions/upload-artifact@v7
        with:
          name: jar-${{ matrix.branch }}
          path: build/libs/pocketbrowser-*.jar
          if-no-files-found: error

  release:
    name: GitHub release
    needs: [plan, publish]
    runs-on: ubuntu-latest

    steps:
      - name: Check out ${{ needs.plan.outputs.notes }}
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.notes }}

      - name: Collect the jars
        uses: actions/download-artifact@v8
        with:
          path: jars
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find jars -name '*-sources.jar' -delete
          ls -la jars
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file CHANGELOG.md \
            jars/*.jar
