plugins {
    id 'net.fabricmc.fabric-loom-no-remap' version '1.14.0-alpha.31'
    id 'java-library'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'TerraformersMC'
        url = 'https://maven.terraformersmc.com/releases'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation("com.terraformersmc:modmenu:${modmenu_version}") {
        exclude group: 'net.fabricmc'
        exclude group: 'net.fabricmc.fabric-api'
    }
}

loom {
    runs {
        client {
            client()
            vmArg "--enable-native-access=ALL-UNNAMED"
        }
    }
}

processResources {
    def props = [version: version]

    inputs.properties(props)
    filesMatching('fabric.mod.json') {
        expand props
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 25
    options.compilerArgs << '-Xlint:all' << '-Xlint:-classfile'
}

idea {
    module {
        downloadSources = true
    }
}
